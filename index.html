function buildMusicCard(track){
  var f=isFavorite(track.videoId),c=state.currentTrack&&state.currentTrack.videoId===track.videoId;
  var thumbUrl = track.thumbnail;
  if(thumbUrl.indexOf('hqdefault.jpg') > -1) {
      thumbUrl = thumbUrl.replace('hqdefault.jpg', 'mqdefault.jpg');
  }
  var h='<div class="music-card'+(c?' now-playing':'')+'" data-videoid="'+escapeHTML(track.videoId)+'">';

  h+='<img class="card-thumb" src="'+escapeHTML(thumbUrl)+'" alt="'+escapeHTML(track.title)+'" loading="lazy" onerror="this.style.background=\'rgba(255,255,255,0.05)\'">';
  h+='<div class="card-overlay"><button class="card-play-btn" onclick="event.stopPropagation();playTrackFromData(\''+escapeHTML(track.videoId)+'\')" aria-label="Play '+escapeHTML(track.title)+'">';
  if(c&&state.isPlaying)h+='<div class="eq-bars"><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span></div>';
  else h+='<svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21" fill="#fff"/></svg>';
  h+='</button></div></div>';
  h+='<div class="card-info"><div class="card-title" title="'+escapeHTML(track.title)+'">'+escapeHTML(track.title)+'</div><div class="card-channel">'+escapeHTML(track.channel)+'</div></div>';
  h+='<div class="card-actions"><button class="card-action-btn card-fav-btn'+(f?' favorited':'')+'" data-videoid="'+escapeHTML(track.videoId)+'" onclick="event.stopPropagation();toggleFavoriteByVideoId(\''+escapeHTML(track.videoId)+'\')" aria-label="Favorite" title="Favorite"><svg viewBox="0 0 24 24" fill="'+(f?'#f43f5e':'none')+'" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg></button>';
  h+='<button class="card-action-btn" onclick="event.stopPropagation();addToQueueByVideoId(\''+escapeHTML(track.videoId)+'\')" aria-label="Add to queue" title="Add to queue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div></div>';
  return h
}

function findTrackByVideoId(vid){return DEMO_TRACKS.concat(state.searchResults,state.favorites,state.history,state.queue).find(function(t){return t.videoId===vid})}
function playTrackFromData(vid){var t=findTrackByVideoId(vid);if(t)playTrack(t)}
function toggleFavoriteByVideoId(vid){var t=findTrackByVideoId(vid);if(t)toggleFavorite(t)}
function addToQueueByVideoId(vid){var t=findTrackByVideoId(vid);if(t)addToQueue(t)}
function highlightCurrentCard(){document.querySelectorAll('.music-card').forEach(function(c){c.classList.toggle('now-playing',state.currentTrack&&state.currentTrack.videoId===c.getAttribute('data-videoid'))})}
function showSkeletonLoading(){var mc=document.getElementById('main-content');if(!mc)return;var q=document.getElementById('search-input')?document.getElementById('search-input').value:'';var h='<div class="section-header"><div><h2 class="section-title">Searching "'+escapeHTML(q)+'"...</h2></div></div><div class="skeleton-grid">';for(var i=0;i<8;i++)h+='<div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-info"><div class="skeleton-line"></div><div class="skeleton-line"></div></div></div>';h+='</div>';mc.innerHTML=h}

function searchYouTube(query){
  if(!query||!query.trim())return;query=query.trim();state.currentPage='search';
  document.querySelectorAll('.nav-item').forEach(function(i){i.classList.toggle('active',i.getAttribute('data-page')==='search')});
  var e=document.getElementById('page-title');if(e)e.textContent='Search';showSkeletonLoading();
  if(isDemoMode()){var lq=query.toLowerCase();var f=DEMO_TRACKS.filter(function(t){return t.title.toLowerCase().indexOf(lq)>-1||t.channel.toLowerCase().indexOf(lq)>-1});if(f.length===0)f=DEMO_TRACKS.slice();state.searchResults=f;state._lastSearchWasLive=false;setTimeout(function(){renderSearchResults()},400);return}
  if(state.searchCache[query]){state.searchResults=state.searchCache[query];state._lastSearchWasLive=true;renderSearchResults();return}
  fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&maxResults=20&q='+encodeURIComponent(query)+'&key='+encodeURIComponent(YOUTUBE_API_KEY))
  .then(function(r){if(!r.ok)throw new Error('API error');return r.json()})
  .then(function(d){if(!d.items||!Array.isArray(d.items)){state.searchResults=[];state._lastSearchWasLive=true;renderSearchResults();return}var seen={},res=[];d.items.forEach(function(item){try{var v=item.id&&item.id.videoId;if(!v||seen[v])return;seen[v]=true;var sn=item.snippet||{};res.push({videoId:v,title:sn.title||'Unknown',channel:sn.channelTitle||'Unknown',thumbnail:(sn.thumbnails&&sn.thumbnails.high&&sn.thumbnails.high.url)||'https://i.ytimg.com/vi/'+v+'/hqdefault.jpg'})}catch(e){}});state.searchResults=res;state.searchCache[query]=res;state._lastSearchWasLive=true;renderSearchResults();showToast('Search completed','success');
  fetch('https://itunes.apple.com/search?term='+encodeURIComponent(query.replace(/official|video|audio|lyrics/gi,'').trim())+'&limit=1&entity=song').then(function(r){return r.json()}).then(function(idata){if(idata.results&&idata.results.length>0){var cover=idata.results[0].artworkUrl100.replace('100x100bb','600x600bb');res.forEach(function(t){t.thumbnail=cover});state.searchResults=res;state.searchCache[query]=res;renderSearchResults();var fp=document.getElementById('fp-thumb');if(fp&&state.currentTrack&&res.find(function(t){return t.videoId===state.currentTrack.videoId}))fp.src=cover;var pt=document.getElementById('player-thumb-img');if(pt&&state.currentTrack&&res.find(function(t){return t.videoId===state.currentTrack.videoId}))pt.src=cover}}).catch(function(){});
  })
  .catch(function(){state.searchResults=DEMO_TRACKS.slice();state._lastSearchWasLive=false;renderSearchResults();showToast('Unable to load live results. Demo shown.','warning')})
}
function handleSearch(){var i=document.getElementById('search-input');if(i&&i.value.trim())searchYouTube(i.value.trim())}
function searchGenre(g){var i=document.getElementById('search-input');if(i)i.value=g;searchYouTube(g)}

function loadYouTubeAPI(){if(window.YT&&window.YT.Player){initYouTubePlayer();return}var t=document.createElement('script');t.src='https://www.youtube.com/iframe_api';var f=document.getElementsByTagName('script')[0];if(f&&f.parentNode)f.parentNode.insertBefore(t,f);else document.head.appendChild(t)}
window.onYouTubeIframeAPIReady=function(){initYouTubePlayer()};
function initYouTubePlayer(){try{var vars={autoplay:0,controls:0,disablekb:1,fs:0,modestbranding:1,rel:0,iv_load_policy:3};if(window.location.protocol!=='file:')vars.origin=window.location.origin;ytPlayer=new YT.Player('yt-player',{height:'200',width:'200',playerVars:vars,events:{onReady:function(){state.playerReady=true;if(state.pendingTrack){playTrack(state.pendingTrack);state.pendingTrack=null}},onStateChange:handleYouTubeStateChange,onError:handleYouTubeError}})}catch(e){showToast('Player init failed','error')}}
function handleYouTubeStateChange(ev){try{switch(ev.data){case YT.PlayerState.PLAYING:state.isPlaying=true;updatePlayPauseUI();startProgressUpdate();break;case YT.PlayerState.PAUSED:state.isPlaying=false;updatePlayPauseUI();stopProgressUpdate();break;case YT.PlayerState.ENDED:state.isPlaying=false;updatePlayPauseUI();stopProgressUpdate();handleTrackEnd();break}}catch(e){}}
function handleYouTubeError(ev){var m={2:'Invalid video.',5:'Player error.',100:'Video not found.',101:'Playback blocked.',150:'Playback blocked.'};showToast((m[ev&&ev.data]||'Playback error.')+' Trying next...','warning');state.isPlaying=false;updatePlayPauseUI();setTimeout(function(){playNext()},1500)}

var currentLyrics = [];
function initLyrics(trackId) {
  var ls = document.querySelector('.lyrics-scroll');
  if (!ls) return;
  ls.innerHTML = '';
  currentLyrics = parseLyrics(LYRICS_DB[trackId]);
  if (currentLyrics.length === 0) {
    ls.innerHTML = '<p class="lyric-line placeholder">No lyrics available</p>';
    return;
  }
  currentLyrics.forEach(function(l, idx) {
    var p = document.createElement('p');
    p.className = 'lyric-line';
    p.textContent = l.text;
    p.dataset.time = l.time;
    p.dataset.index = idx;
    p.onclick = function() { if(ytPlayer && state.playerReady) ytPlayer.seekTo(l.time, true); };
    ls.appendChild(p);
  });
}

function toggleLyrics() {
  var vc = document.querySelector('.fp-album-container');
  var fpl = document.getElementById('fp-lyrics');
  var btn = document.getElementById('fp-lyrics-btn');
  if(vc && fpl) {
    var isShow = vc.classList.toggle('show-lyrics');
    if (btn) btn.classList.toggle('active', isShow);
    if(isShow && state.currentTrack) initLyrics(state.currentTrack.videoId);
  }
}

function playTrack(track){
  if(!track||!track.videoId)return;
  if(!state.playerReady){state.pendingTrack=track;showToast('Player loading...','info');document.getElementById('player-bar').classList.remove('hidden');updatePlayerTrackInfo(track);return}
  state.currentTrack=track;updatePlayerTrackInfo(track);addToHistory(track);
  document.getElementById('player-bar').classList.remove('hidden');
  try{ytPlayer.loadVideoById(track.videoId);ytPlayer.playVideo();if(state.muted)ytPlayer.mute();else{ytPlayer.unMute();ytPlayer.setVolume(state.volume)}}catch(e){showToast('Click Play to start','info')}
  highlightCurrentCard();updateFullPlayerUI();renderQueueDrawerList()
}
function updatePlayerTrackInfo(t){var e=document.getElementById('player-thumb-img');if(e)e.src=t.thumbnail;e=document.getElementById('player-title');if(e)e.textContent=t.title;e=document.getElementById('player-channel');if(e)e.textContent=t.channel;e=document.getElementById('fp-thumb');if(e)e.src=t.thumbnail;e=document.getElementById('fp-title');if(e)e.textContent=t.title;e=document.getElementById('fp-channel');if(e)e.textContent=t.channel;var bg=document.getElementById('fp-bg-blur');if(bg)bg.style.backgroundImage='url("'+t.thumbnail+'")';updateFavoriteButtons()}
function togglePlayPause(){if(!state.playerReady||!ytPlayer){showToast('Player loading...','info');return}try{if(state.isPlaying)ytPlayer.pauseVideo();else{if(state.currentTrack)ytPlayer.playVideo();else if(DEMO_TRACKS.length>0)playTrack(DEMO_TRACKS[0])}}catch(e){showToast('Click Play to start','info')}}
function updatePlayPauseUI(){var pi=document.getElementById('play-icon'),pa=document.getElementById('pause-icon');if(pi)pi.style.display=state.isPlaying?'none':'block';if(pa)pa.style.display=state.isPlaying?'block':'none';var fp=document.getElementById('full-player');if(fp){var fpp=fp.querySelector('.fp-play'),fpa=fp.querySelector('.fp-pause');if(fpp)fpp.style.display=state.isPlaying?'none':'block';if(fpa)fpa.style.display=state.isPlaying?'block':'none'}var b=document.getElementById('play-pause-btn');if(b)b.setAttribute('aria-label',state.isPlaying?'Pause':'Play');highlightCurrentCard();updateFullPlayerUI()}
function playNext(){var p=getPlayPool();if(p.length===0)return;if(state.isShuffle){var r;if(p.length>1){do{r=Math.floor(Math.random()*p.length)}while(state.currentTrack&&p[r].videoId===state.currentTrack.videoId)}else r=0;playTrack(p[r]);return}var ci=-1;if(state.currentTrack)ci=p.findIndex(function(t){return t.videoId===state.currentTrack.videoId});var ni=ci+1;if(ni>=p.length){if(state.repeatMode==='all')ni=0;else{state.isPlaying=false;updatePlayPauseUI();stopProgressUpdate();return}}playTrack(p[ni])}
function playPrevious(){var p=getPlayPool();if(p.length===0)return;try{if(ytPlayer&&state.playerReady&&ytPlayer.getCurrentTime&&ytPlayer.getCurrentTime()>3){ytPlayer.seekTo(0,true);return}}catch(e){}var ci=-1;if(state.currentTrack)ci=p.findIndex(function(t){return t.videoId===state.currentTrack.videoId});var pi=ci-1;if(pi<0)pi=p.length-1;playTrack(p[pi])}
function getPlayPool(){if(state.queue.length>0)return state.queue;if(state.searchResults.length>0)return state.searchResults;return DEMO_TRACKS}
function handleTrackEnd(){if(state.repeatMode==='one'){try{ytPlayer.seekTo(0,true);ytPlayer.playVideo()}catch(e){}return}playNext()}
function toggleShuffle(){state.isShuffle=!state.isShuffle;var b=document.getElementById('shuffle-btn');if(b)b.classList.toggle('active',state.isShuffle);var f=document.getElementById('fp-shuffle');if(f)f.classList.toggle('active',state.isShuffle);showToast('Shuffle '+(state.isShuffle?'on':'off'),'info')}
function toggleRepeat(){var m=['off','all','one'];state.repeatMode=m[(m.indexOf(state.repeatMode)+1)%3];var b=document.getElementById('repeat-btn'),f=document.getElementById('fp-repeat');if(b){b.classList.toggle('active',state.repeatMode!=='off');b.title='Repeat: '+state.repeatMode;var ex=b.querySelector('.r1b');if(ex)ex.remove();if(state.repeatMode==='one'){var bd=document.createElement('span');bd.className='r1b';bd.textContent='1';bd.style.cssText='position:absolute;top:2px;right:2px;font-size:9px;font-weight:700;color:var(--accent)';b.style.position='relative';b.appendChild(bd)}}if(f)f.classList.toggle('active',state.repeatMode!=='off');showToast('Repeat: '+state.repeatMode,'info')}
function seekForward(){try{if(ytPlayer&&state.playerReady)ytPlayer.seekTo(ytPlayer.getCurrentTime()+10,true)}catch(e){}}
function seekBackward(){try{if(ytPlayer&&state.playerReady)ytPlayer.seekTo(Math.max(0,ytPlayer.getCurrentTime()-10),true)}catch(e){}}
function seekToPosition(ev){try{if(!ytPlayer||!state.playerReady)return;var b=ev.currentTarget,r=b.getBoundingClientRect();var p=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));var d=ytPlayer.getDuration();if(d)ytPlayer.seekTo(p*d,true)}catch(e){}}

function startProgressUpdate(){stopProgressUpdate();progressInterval=setInterval(updateProgress,200)}
function stopProgressUpdate(){if(progressInterval){clearInterval(progressInterval);progressInterval=null}}
function updateProgress(){try{if(!ytPlayer||!state.playerReady||!ytPlayer.getCurrentTime)return;var c=ytPlayer.getCurrentTime()||0,d=ytPlayer.getDuration()||0;var p=d>0?(c/d)*100:0;var e=document.getElementById('progress-fill');if(e)e.style.width=p+'%';e=document.getElementById('current-time');if(e)e.textContent=formatTime(c);e=document.getElementById('total-time');if(e)e.textContent=formatTime(d);e=document.getElementById('fp-progress-fill');if(e)e.style.width=p+'%';e=document.getElementById('fp-current');if(e)e.textContent=formatTime(c);e=document.getElementById('fp-total');if(e)e.textContent=formatTime(d);e=document.getElementById('progress-bar');if(e)e.setAttribute('aria-valuenow',Math.round(p));syncLyrics(c)}catch(e){}}

var activeLyricIndex = -1;
function syncLyrics(currentTime) {
  if (currentLyrics.length === 0) return;
  var newIndex = -1;
  for (var i = 0; i < currentLyrics.length; i++) {
    if (currentTime >= currentLyrics[i].time) newIndex = i;
    else break;
  }
  if (newIndex !== activeLyricIndex && newIndex !== -1) {
    activeLyricIndex = newIndex;
    var ls = document.querySelector('.lyrics-scroll');
    if (!ls) return;
    var lines = ls.querySelectorAll('.lyric-line');
    lines.forEach(function(l, i) { l.classList.toggle('active', i === newIndex); });
    var activeLine = lines[newIndex];
    if (activeLine) {
      ls.scrollTo({ top: activeLine.offsetTop - ls.clientHeight / 2 + 20, behavior: 'smooth' });
    }
  }
}

function setVolume(v){state.volume=parseInt(v,10);state.muted=false;try{if(ytPlayer&&state.playerReady){ytPlayer.unMute();ytPlayer.setVolume(state.volume)}}catch(e){}updateVolumeUI()}
function toggleMute(){state.muted=!state.muted;try{if(ytPlayer&&state.playerReady){if(state.muted)ytPlayer.mute();else{ytPlayer.unMute();ytPlayer.setVolume(state.volume)}}}catch(e){}updateVolumeUI()}
function updateVolumeUI(){var v=document.getElementById('vol-icon'),m=document.getElementById('mute-icon'),s=document.getElementById('volume-slider'),fps=document.getElementById('fp-volume-slider');if(v)v.style.display=state.muted?'none':'block';if(m)m.style.display=state.muted?'block':'none';if(s)s.value=state.muted?0:state.volume;if(fps)fps.value=state.muted?0:state.volume;var b=document.getElementById('mute-btn');if(b)b.setAttribute('aria-label',state.muted?'Unmute':'Mute')}

function handleKeyboardShortcuts(e){var tag=e.target.tagName,ed=e.target.isContentEditable;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||ed){if(e.key==='Escape')e.target.blur();return}switch(e.key){case' ':e.preventDefault();togglePlayPause();break;case'ArrowRight':e.preventDefault();seekForward();break;case'ArrowLeft':e.preventDefault();seekBackward();break;case'/':e.preventDefault();var i=document.getElementById('search-input');if(i)i.focus();break;case'Escape':closeAllOverlays();break}}
function closeAllOverlays(){closeModal();closeFullPlayer();var q=document.getElementById('queue-drawer');if(q&&q.classList.contains('open'))toggleQueueDrawer();closeMobileSidebar()}

function setupEventListeners(){
  document.addEventListener('keydown',handleKeyboardShortcuts);
  var si=document.getElementById('search-input');if(si)si.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();handleSearch()}});
  var so=document.getElementById('sidebar-overlay');if(so)so.addEventListener('click',closeMobileSidebar);
  var mo=document.getElementById('modal-overlay');if(mo)mo.addEventListener('click',function(e){if(e.target===mo)closeModal()});
  window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',function(){if(getSettings().theme==='system')updateTheme('system')});
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){var s=getSettings();if(!s.reduceMotion){s.reduceMotion=true;saveSettings(s);applySettings(s)}}

  var fp = document.getElementById('full-player');
  if (fp) {
    var startY = 0, isDragging = false;
    fp.addEventListener('touchstart', function(e) {
      var t = e.target;
      if(t.closest('.fp-progress-container') || t.closest('.fp-volume-row') || t.closest('.lyrics-scroll')) return;
      startY = e.touches[0].clientY;
      isDragging = true;
      fp.classList.add('dragging');
    }, {passive: true});
    fp.addEventListener('touchmove', function(e) {
      if (!isDragging) return;
      var deltaY = e.touches[0].clientY - startY;
      if (deltaY > 0) {
        e.preventDefault();
        fp.style.transform = 'translateY(' + deltaY + 'px)';
      }
    }, {passive: false});
    fp.addEventListener('touchend', function(e) {
      if (!isDragging) return;
      isDragging = false;
      fp.classList.remove('dragging');
      var deltaY = e.changedTouches[0].clientY - startY;
      fp.style.transform = '';
      if (deltaY > 120) closeFullPlayer();
    });
  }
}

function initApp(){loadSettings();loadFavorites();loadHistory();loadYouTubeAPI();setupEventListeners();renderHome();if(isDemoMode())setTimeout(function(){showToast('Demo mode: Add a YouTube API key for live search','info')},1000)}
document.addEventListener('DOMContentLoaded',initApp);
